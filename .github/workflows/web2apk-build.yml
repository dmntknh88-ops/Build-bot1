name: Web2APK Auto Build Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID dari Web2APK Bot'
        required: true
        default: 'default-job'
      userId:
        description: 'User ID Telegram'
        required: true
        default: '0'
      payload:
        description: 'Payload JSON'
        required: true
        default: '{}'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Environment
        run: |
          echo "JOB_ID=${{ github.event.inputs.jobId }}" >> $GITHUB_ENV
          mkdir -p ./workspace ./output ./temp

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl wget unzip zip python3 git openjdk-17-jdk

      - name: 🔨 Process Build
        run: |
          echo "🚀 Processing build job ${{ github.event.inputs.jobId }}"
          echo "${{ github.event.inputs.payload }}" > ./workspace/payload.json
          echo "Build completed at $(date -u)" > ./output/BUILD-INFO.txt

      - name: 📦 Create APK Artifact
        run: |
          cd ./output
          find ../workspace -name "*.apk" -exec cp {} ./ \; 2>/dev/null || true
          ls -la ./

      - name: ⬆️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ./output/
          retention-days: 7
          if-no-files-found: warn

      - name: 🚀 Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: ./output/*
          tag_name: build-${{ github.run_id }}
          name: "🚀 Build ${{ github.event.inputs.jobId }}"
          body: |
            ## 📱 Web2APK Build Output
            | Detail | Value |
            |--------|-------|
            | **Job ID** | ${{ github.event.inputs.jobId }} |
            | **User ID** | ${{ github.event.inputs.userId }} |
            | **Build ID** | ${{ github.run_id }} |
            | **Date** | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Send Callback
        if: github.event.inputs.payload != '{}' && contains(github.event.inputs.payload, 'callback_url')
        run: |
          CALLBACK_URL=$(echo '${{ github.event.inputs.payload }}' | python3 -c "import sys,json; print(json.load(sys.stdin).get('callback_url',''))")
          if [ -n "$CALLBACK_URL" ]; then
            curl -s -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"status\": \"completed\",
                \"job_id\": \"${{ github.event.inputs.jobId }}\",
                \"run_id\": \"${{ github.run_id }}\",
                \"download_url\": \"https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_id }}\"
              }" || true
          fi

      - name: 🧹 Cleanup
        if: always()
        run: rm -rf ./workspace ./temp